apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: emotion-prod
data:
  nginx.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Headers de securite pour l'acces camera
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=*,microphone=*" always;

        # Autoriser les challenges Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /predict {
            proxy_pass http://emotion-backend-service.emotion-prod.svc.cluster.local:8080/predict;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://emotion-backend-service.emotion-prod.svc.cluster.local:8080/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
